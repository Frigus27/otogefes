<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile Preview · 合肥「第一」音游祭</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23171811%22/%3E%3Cpath d=%22M8 3v10M3 8h10%22 stroke=%22%23dcff4f%22/%3E%3C/svg%3E" />
    <style>
      :root {
        --ink: #171811;
        --ink-raised: #202118;
        --paper: #f3f0e6;
        --muted: #a7a998;
        --signal: #dcff4f;
        --flare: #ff5f3b;
        --line: rgba(243, 240, 230, 0.14);
        --w: 390px;
        --h: 844px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px),
          var(--ink);
        background-size: 48px 48px;
        color: var(--paper);
        font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
      }

      .shell {
        width: min(100%, 1480px);
        margin: 0 auto;
        padding: 28px 24px 64px;
      }

      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--signal);
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "Songti SC", "Noto Serif CJK SC", serif;
        font-size: clamp(28px, 3.4vw, 48px);
        font-weight: 900;
        letter-spacing: -0.04em;
      }

      h1 span { color: var(--signal); }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--paper);
        padding: 9px 12px;
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.04em;
        cursor: pointer;
      }

      button:hover,
      button.is-active {
        border-color: var(--signal);
        background: var(--signal);
        color: var(--ink);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 0 26px;
        color: var(--muted);
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.04em;
      }

      .devices {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: center;
        gap: 34px;
      }

      .device {
        width: calc(var(--w) + 22px);
        max-width: 100%;
      }

      .device__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.06em;
      }

      .device__head span:first-child { color: var(--paper); }
      .device__head span:last-child { color: var(--muted); }

      .phone {
        position: relative;
        width: calc(var(--w) + 22px);
        max-width: 100%;
        padding: 10px;
        border: 1px solid rgba(243, 240, 230, 0.2);
        border-radius: 46px;
        background: #080906;
        box-shadow:
          0 30px 60px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(0, 0, 0, 0.7);
      }

      .phone::before {
        position: absolute;
        z-index: 2;
        top: 16px;
        left: 50%;
        width: 76px;
        height: 22px;
        transform: translateX(-50%);
        border-radius: 20px;
        background: #050605;
        content: "";
        pointer-events: none;
      }

      .phone__status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 30px;
        padding: 0 18px;
        color: #a7a998;
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 9px;
        letter-spacing: 0.04em;
      }

      iframe {
        display: block;
        width: 100%;
        height: var(--h);
        border: 0;
        border-radius: 36px;
        background: var(--paper);
      }

      .device__foot {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-top: 9px;
        color: var(--muted);
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 9px;
        letter-spacing: 0.04em;
      }

      .device__foot a {
        color: var(--signal);
        text-decoration: none;
      }

      .device__foot a:hover { text-decoration: underline; }

      @media (max-width: 900px) {
        .shell { padding-inline: 16px; }
        .devices { gap: 28px; }
      }

      @media (max-width: 520px) {
        .topbar { align-items: flex-start; }
        .controls { width: 100%; }
        .controls button { flex: 1 1 auto; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Mobile simulator / 移动端模拟器</p>
          <h1>合肥<span>「第一」</span>音游祭</h1>
        </div>
        <div class="controls" aria-label="设备尺寸">
          <button type="button" class="is-active" data-width="390" data-height="844">390 × 844</button>
          <button type="button" data-width="375" data-height="812">375 × 812</button>
          <button type="button" data-width="320" data-height="700">320 × 700</button>
          <button type="button" id="refresh">刷新画面</button>
        </div>
      </header>

      <div class="meta">
        <span>LIVE VIEW · CHROMIUM MOBILE VIEWPORT · LOCAL PREVIEW ONLY</span>
        <span>可直接在下方设备中滚动、点击菜单与切换页面</span>
      </div>

      <section class="devices" aria-label="移动端页面预览">
        <article class="device">
          <div class="device__head"><span>01 / 首页</span><span id="size-home">390 × 844</span></div>
          <div class="phone">
            <div class="phone__status"><span>9:41</span><span>● ● ●</span></div>
            <iframe src="http://127.0.0.1:4400/" title="移动端首页预览"></iframe>
          </div>
          <div class="device__foot">
            <span>HOME / RESPONSIVE</span>
            <a href="http://127.0.0.1:4400/" target="_blank" rel="noopener">独立打开 ↗</a>
          </div>
        </article>

        <article class="device">
          <div class="device__head"><span>02 / 预选榜单</span><span id="size-ranking">390 × 844</span></div>
          <div class="phone">
            <div class="phone__status"><span>9:41</span><span>● ● ●</span></div>
            <iframe src="http://127.0.0.1:4400/ranking/" title="移动端榜单预览"></iframe>
          </div>
          <div class="device__foot">
            <span>RANKING / LIVE JSON</span>
            <a href="http://127.0.0.1:4400/ranking/" target="_blank" rel="noopener">独立打开 ↗</a>
          </div>
        </article>

        <article class="device">
          <div class="device__head"><span>03 / 现场赛程</span><span id="size-schedule">390 × 844</span></div>
          <div class="phone">
            <div class="phone__status"><span>9:41</span><span>● ● ●</span></div>
            <iframe src="http://127.0.0.1:4400/schedule/" title="移动端赛程预览"></iframe>
          </div>
          <div class="device__foot">
            <span>SCHEDULE / PLACEHOLDER</span>
            <a href="http://127.0.0.1:4400/schedule/" target="_blank" rel="noopener">独立打开 ↗</a>
          </div>
        </article>
      </section>
    </main>

    <script>
      const root = document.documentElement;
      const buttons = [...document.querySelectorAll("[data-width]")];
      const iframes = [...document.querySelectorAll("iframe")];
      const sizeLabels = ["size-home", "size-ranking", "size-schedule"];
      const routes = ["/", "/ranking/", "/schedule/"];
      const siteBase = (new URLSearchParams(location.search).get("site") || "http://127.0.0.1:4400").replace(/\/$/, "");

      // Allow the launcher script to point the preview at a non-default dev port.
      iframes.forEach((frame, index) => {
        frame.src = `${siteBase}${routes[index]}`;
      });
      document.querySelectorAll(".device__foot a").forEach((link, index) => {
        link.href = `${siteBase}${routes[index]}`;
      });

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          buttons.forEach((item) => item.classList.toggle("is-active", item === button));
          const width = `${button.dataset.width}px`;
          const height = `${button.dataset.height}px`;
          const label = `${button.dataset.width} × ${button.dataset.height}`;

          root.style.setProperty("--w", width);
          root.style.setProperty("--h", height);
          sizeLabels.forEach((id) => {
            const element = document.getElementById(id);
            if (element) element.textContent = label;
          });
        });
      });

      document.getElementById("refresh")?.addEventListener("click", () => {
        iframes.forEach((frame) => {
          frame.src = frame.src;
        });
      });
    </script>
  </body>
</html>
